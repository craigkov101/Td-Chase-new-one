name: Build NFL Chase v0.6.1

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TD Engine APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract NFL Chase v0.6.1
        run: |
          unzip -q NFLChase-v0.6.1-TD-Engine.zip -d nflchase
          echo "NFL Chase v0.6.1 extracted successfully"

      - name: Build Android APK
        run: |
          SETTINGS=$(find nflchase -type f -name "settings.gradle.kts" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find nflchase -type f
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "Building NFL Chase project at:"
          echo "$PROJECT"

          cd "$PROJECT"

          echo "Starting Android build..."
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          APK=$(find nflchase -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find nflchase -type f | grep -E "\.apk$|build/outputs" || true
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/NFL-Chase-v0.6.1.apk

          echo "================================"
          echo "NFL CHASE v0.6.1 APK READY"
          echo "================================"

          ls -lh release/NFL-Chase-v0.6.1.apk

      - name: Upload NFL Chase APK
        uses: actions/upload-artifact@v4
        with:
          name: NFL-Chase-v0.6.1
          path: release/NFL-Chase-v0.6.1.apk
          if-no-files-found: error
          retention-days: 30
