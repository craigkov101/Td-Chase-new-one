name: Build NFL Chase v0.6.0

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TD Engine APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract NFL Chase
        run: |
          unzip -q NFLChase-v0.6.0-TD-Engine.zip -d nflchase
          echo "NFL Chase extracted"

      - name: Build Android APK
        run: |
          SETTINGS=$(find nflchase -type f -name "settings.gradle.kts" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "Building project at:"
          echo "$PROJECT"

          cd "$PROJECT"

          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          APK=$(find nflchase -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/NFL-Chase-v0.6.0.apk

          echo "APK READY:"
          ls -lh release/NFL-Chase-v0.6.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFL-Chase-v0.6.0
          path: release/NFL-Chase-v0.6.0.apk
          if-no-files-found: error
