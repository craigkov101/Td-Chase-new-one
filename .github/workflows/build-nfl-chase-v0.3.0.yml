
name: Build TD Chase v1.13.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          sdkmanager --version
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract TD Chase source
        run: |
          test -f NFLChase-v1.13.0-Visual-Foundation.zip
          unzip -tq NFLChase-v1.13.0-Visual-Foundation.zip
          mkdir -p project
          unzip -q NFLChase-v1.13.0-Visual-Foundation.zip -d project

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          test -f "$PROJECT_DIR/settings.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify ESPN feed
        continue-on-error: true
        run: |
          python3 "$PROJECT_DIR/tools/verify_live_scoring_feed.py"

      - name: Run Android unit tests
        run: |
          cd "$PROJECT_DIR"
          gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Compile Android APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find "$PROJECT_DIR" -name app-debug.apk -print -quit)
          test -n "$APK"
          cp "$APK" release/TD-Chase-v1.13.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TD-Chase-v1.13.0
          path: release/TD-Chase-v1.13.0.apk
          if-no-files-found: error
