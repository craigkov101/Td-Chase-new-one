
name: Build NFL Chase v1.8.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract NFL Chase source
        run: |
          test -f NFLChase-v1.8.0-Scoring-Tendencies-Preview.zip
          mkdir -p project
          unzip -q NFLChase-v1.8.0-Scoring-Tendencies-Preview.zip -d project

      - name: Build Android APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          test -f "$PROJECT_DIR/settings.gradle.kts"
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find project -name app-debug.apk -print -quit)
          test -n "$APK"
          cp "$APK" release/NFL-Chase-v1.8.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFL-Chase-v1.8.0
          path: release/NFL-Chase-v1.8.0.apk
          if-no-files-found: error
