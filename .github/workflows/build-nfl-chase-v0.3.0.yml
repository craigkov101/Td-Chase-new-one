
name: Build NFL Chase v1.6.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Extract project
        run: unzip -q NFLChase-v1.6.2-Schedule-Recovery.zip -d nflchase

      - name: Build APK
        run: |
          cd "$(dirname "$(find nflchase -name settings.gradle.kts | head -1)")"
          gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFL-Chase-v1.6.2
          path: nflchase/**/app/build/outputs/apk/debug/app-debug.apk
