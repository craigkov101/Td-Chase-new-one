name: Build NFL Chase APK v0.3.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unzip NFL Chase source
        run: |
          rm -rf NFLChase
          unzip -o NFLChase-v0.3.0-Game-Intelligence.zip -d NFLChase

      - name: Make Gradle wrapper executable
        run: chmod +x NFLChase/gradlew

      - name: Run unit tests
        run: ./gradlew -p NFLChase testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew -p NFLChase assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFLChase-v0.3.0-APK
          path: NFLChase/app/build/outputs/apk/debug/app-debug.apk
