name: Build NFL Chase APK v0.5.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unzip NFL Chase v0.5.1
        run: |
          rm -rf NFLChaseBuild
          mkdir NFLChaseBuild

          unzip -o NFLChase-v0.5.1-Data-Recovery.zip -d NFLChaseBuild

          echo "===== EXTRACTED FILES ====="
          find NFLChaseBuild -maxdepth 4 -type f | head -150

      - name: Find Android project
        run: |
          GRADLEW=$(find NFLChaseBuild -type f -
