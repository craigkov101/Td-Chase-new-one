name: Build NFL Chase v1.1.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract
        run: |
          ZIP=$(find . -type f -iname "*v1.1.0*.zip" | head -1)
          test -n "$ZIP" || exit 1
          echo "Using $ZIP"
          mkdir -p nflchase
          unzip -q "$ZIP
