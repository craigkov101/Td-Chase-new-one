name: Build NFL Chase v0.6.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "NFLChase-v0.6.0-TD-Engine.zip"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    name: Build TD Engine APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract NFL Chase v0.6.0
        shell: bash
        run: |
          set -e

