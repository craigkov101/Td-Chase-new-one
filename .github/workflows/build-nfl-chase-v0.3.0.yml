name: Build NFL Chase APK v0.5.2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unzip NFL Chase v0.5.2
        run: |
          rm -rf NFLChaseBuild
          mkdir -p NFLChaseBuild

          unzip -o NFLChase-v0.5.2-Player-Data.zip -d NFLChaseBuild

          echo "===== NFL CHASE v0.5.2 EXTRACTED ====="
          find NFLChaseBuild -maxdepth 4 -type f | head -150

      - name: Find Android project
        shell: bash
        run: |
          find NFLChaseBuild -type f -name gradlew -print > gradlew_location.txt

          if [ ! -s gradlew_location.txt ]; then
            echo "ERROR: Could not find gradlew."
            echo "Files inside source ZIP:"
            find NFLChaseBuild -maxdepth 6 -type f
            exit 1
          fi

          read -r GRADLEW < gradlew_location.txt
          PROJECT_DIR="${GRADLEW%/gradlew}"

          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify NFL Chase project
        shell: bash
        run: |
          echo "===== PROJECT
