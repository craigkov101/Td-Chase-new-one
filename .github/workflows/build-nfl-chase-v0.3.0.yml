
name: Build TD Chase v1.13.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Android SDK location: $SDK_ROOT"

          test -d "$SDK_ROOT"

          if [ ! -d "$SDK_ROOT/platforms/android-35" ] || \
             [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then

            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager -print -quit)

            test -n "$SDKMANAGER"

            echo "Using SDK manager: $SDKMANAGER"

            "$SDKMANAGER" \
              --sdk_root="$SDK_ROOT" \
              --install \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi

          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"

          echo "Android SDK verified successfully"

      - name: Extract TD Chase source
        run: |
          test -f NFLChase-v1.13.0-Visual-Foundation.zip

          unzip -tq NFLChase-v1.13.0-Visual-Foundation.zip

          mkdir -p project

          unzip -q NFLChase-v1.13.0-Visual-Foundation.zip -d project

          PROJECT_DIR=$(dirname "$(find project \
            -name settings.gradle.kts -print -quit)")

          test -f "$PROJECT_DIR/settings.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check project integrity
        run: |
          python3 "$PROJECT_DIR/tools/check_project_integrity.py"

      - name: Check ESPN data feeds
        continue-on-error: true
        run: |
          python3 "$PROJECT_DIR/tools/verify_live_scoring_feed.py"

      - name: Run Android unit tests
        run: |
          cd "$PROJECT_DIR"
          gradle clean testDebugUnitTest --no-daemon --stacktrace

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release

          APK=$(find "$PROJECT_DIR" \
            -name app-debug.apk -print -quit)

          test -n "$APK"

          cp "$APK" release/TD-Chase-v1.13.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TD-Chase-v1.13.0
          path: release/TD-Chase-v1.13.0.apk
          if-no-files-found: error
