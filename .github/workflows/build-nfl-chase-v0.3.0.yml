
name: Build NFL Chase v1.6.4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract NFL Chase source
        run: |
          unzip -q NFLChase-v1.6.4-Responsive-Feed.zip -d project

      - name: Build Android APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find project -name app-debug.apk | head -1)
          cp "$APK" release/NFL-Chase-v1.6.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFL-Chase-v1.6.4
          path: release/NFL-Chase-v1.6.4.apk
          if-no-files-found: error
