
name: Build NFL Chase v1.6.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract source
        run: unzip -q NFLChase-v1.6.3-Quality-Pass.zip -d project

      - name: Compile debug APK
        run: |
          cd "$(dirname "$(find project -name settings.gradle.kts | head -1)")"
          gradle clean assembleDebug --no-daemon

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: NFL-Chase-v1.6.3-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
