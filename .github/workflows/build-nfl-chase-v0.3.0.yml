
name: Build NFL Chase v1.5.5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Extract project
        run: unzip -q NFLChase-v1.5.5-Schedule-Fallback.zip -d nflchase

      - name: Build APK
        run: |
          cd "$(dirname "$(find nflchase -name settings.gradle.kts | head -1)")"
          gradle clean assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          cp "$(find nflchase -name app-debug.apk | head -1)" release/NFL-Chase-v1.5.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFL-Chase-v1.5.5-Schedule-Fallback
          path: release/NFL-Chase-v1.5.5.apk
