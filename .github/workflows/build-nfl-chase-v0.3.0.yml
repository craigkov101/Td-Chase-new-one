
name: Build NFL Chase v1.6.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NFLChase-v1.6.4-Responsive-Feed.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract NFL Chase source
        run: |
          test -f NFLChase-v1.6.4-Responsive-Feed.zip
          mkdir -p project
          unzip -q NFLChase-v1.6.4-Responsive-Feed.zip -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Android project not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find "$PROJECT_DIR" -name app-debug.apk -print -quit)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$APK" release/NFL-Chase-v1.6.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFL-Chase-v1.6.4
          path: release/NFL-Chase-v1.6.4.apk
          if-no-files-found: error
          retention-days: 30
