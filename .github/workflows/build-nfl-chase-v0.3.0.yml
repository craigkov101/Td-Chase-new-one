name: Build NFL Chase APK v0.3.0

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "NFLChase-v0.3.0-Game-Intelligence.zip"
      - ".github/workflows/build-nfl-chase-v0.3.0.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

- name: Configure Android SDK
  run: |
    echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
    yes | sdkmanager --licenses > /dev/null || true
    sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unzip NFL Chase source
        run: |
          rm -rf NFLChase
          unzip -o NFLChase-v0.3.0-Game-Intelligence.zip

      - name: Make Gradle wrapper executable
        run: chmod +x NFLChase/gradlew

      - name: Run unit tests
        run: ./gradlew -p NFLChase testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew -p NFLChase assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFLChase-v0.3.0-APK
          path: NFLChase/app/build/outputs/apk/debug/app-debug.apk
