
name: Build NFL Chase v1.8.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q NFLChase-v1.8.1-Scoring-Data-Fix.zip -d project

      - name: Check live ESPN scoring data
        continue-on-error: true
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          python3 "$PROJECT_DIR/tools/verify_live_scoring_feed.py"

      - name: Run tests and build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          test -f "$PROJECT_DIR/settings.gradle.kts"
          cd "$PROJECT_DIR"
          gradle clean testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find project -name app-debug.apk -print -quit)
          test -n "$APK"
          cp "$APK" release/NFL-Chase-v1.8.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFL-Chase-v1.8.1
          path: release/NFL-Chase-v1.8.1.apk
          if-no-files-found: error
