name: Build NFL Chase v1.1.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract
        run: |
          ZIP=$(find . -type f -iname "*v1.1.0*.zip" | head -1)
          test -n "$ZIP" || exit 1
          mkdir nflchase
          unzip -q "$ZIP" -d nflchase

      - name: Build
        run: |
          SETTINGS=$(find nflchase -name "settings.gradle.kts" | head -1)
          test -n "$SETTINGS" || exit 1
          PROJECT=$(dirname "$SETTINGS")
          cd "$PROJECT"
          gradle clean assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          APK
