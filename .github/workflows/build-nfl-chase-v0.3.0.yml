
name: Build TD Chase v1.11.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify and unpack TD Chase source
        run: |
          test -f NFLChase-v1.11.0-Drive-Insights-Refresh.zip
          unzip -tq NFLChase-v1.11.0-Drive-Insights-Refresh.zip
          mkdir -p project
          unzip -q NFLChase-v1.11.0-Drive-Insights-Refresh.zip -d project
          test -f "$(find project -name settings.gradle.kts -print -quit)"

      - name: Check current ESPN rosters and scoring feeds
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          python3 "$PROJECT_DIR/tools/verify_live_scoring_feed.py"

      - name: Run Android unit tests
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          cd "$PROJECT_DIR"
          gradle clean testDebugUnitTest --no-daemon --stacktrace

      - name: Compile Android APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find project -name app-debug.apk -print -quit)
          test -n "$APK"
          cp "$APK" release/TD-Chase-v1.11.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TD-Chase-v1.11.0
          path: release/TD-Chase-v1.11.0.apk
          if-no-files-found: error
