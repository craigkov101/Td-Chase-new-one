name: Build NFL Chase v0.9.0

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Matchup Explainer APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract NFL Chase
        run: |
          unzip -q NFLChase-v0.9.0-Matchup-Explainer
