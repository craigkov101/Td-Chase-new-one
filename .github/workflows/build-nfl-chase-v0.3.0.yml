
name: Build TD Chase v1.8.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract TD Chase source
        run: |
          test -f NFLChase-v1.8.2-Usage-Injury-Engine.zip
          mkdir -p project
          unzip -q NFLChase-v1.8.2-Usage-Injury-Engine.zip -d project

      - name: Verify live ESPN data
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          test -f "$PROJECT_DIR/tools/verify_live_scoring_feed.py"
          python3 "$PROJECT_DIR/tools/verify_live_scoring_feed.py"

      - name: Run tests and build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          test -f "$PROJECT_DIR/settings.gradle.kts"
          cd "$PROJECT_DIR"
          gradle clean testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find project -name app-debug.apk -print -quit)
          test -n "$APK"
          cp "$APK" release/TD-Chase-v1.8.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TD-Chase-v1.8.2
          path: release/TD-Chase-v1.8.2.apk
          if-no-files-found: error
