
name: Build TD Chase v1.15.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          test -d "$SDK_ROOT" || { echo 'Android SDK folder missing'; exit 1; }

          if [ ! -d "$SDK_ROOT/platforms/android-35" ] || [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)
            test -n "$SDKMANAGER" || { echo 'Android SDK manager missing'; exit 1; }
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Unpack TD Chase source
        shell: bash
        run: |
          test -f NFLChase-v1.15.1-Scripts-Stability-Fix.zip
          unzip -tq NFLChase-v1.15.1-Scripts-Stability-Fix.zip
          mkdir -p project
          unzip -q NFLChase-v1.15.1-Scripts-Stability-Fix.zip -d project

          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          test -f "$PROJECT_DIR/settings.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Release integrity checks
        run: python3 "$PROJECT_DIR/tools/check_project_integrity.py"

      - name: Verify ESPN feed
        continue-on-error: true
        run: python3 "$PROJECT_DIR/tools/verify_live_scoring_feed.py"

      - name: Run Android unit tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle clean testDebugUnitTest --no-daemon --stacktrace

      - name: Compile debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find "$PROJECT_DIR" -name app-debug.apk -print -quit)
          test -n "$APK"
          cp "$APK" release/TD-Chase-v1.15.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TD-Chase-v1.15.1
          path: release/TD-Chase-v1.15.1.apk
          if-no-files-found: error
