
name: Build TD Chase v1.13.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract TD Chase v1.13.0
        run: |
          test -f NFLChase-v1.13.0-Visual-Foundation.zip
          unzip -tq NFLChase-v1.13.0-Visual-Foundation.zip
          mkdir -p project
          unzip -q NFLChase-v1.13.0-Visual-Foundation.zip -d project

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          test -f "$PROJECT_DIR/settings.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify ESPN data feed
        continue-on-error: true
        run: |
          python3 "$PROJECT_DIR/tools/verify_live_scoring_feed.py"

      - name: Run unit tests
        run: |
          cd "$PROJECT_DIR"
          gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find "$PROJECT_DIR" -name app-debug.apk -print -quit)
          test -n "$APK"
          cp "$APK" release/TD-Chase-v1.13.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TD-Chase-v1.13.0
          path: release/TD-Chase-v1.13.0.apk
          if-no-files-found: error
